name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Check source tree for publication leaks
        run: python tools/check_publication_privacy.py

      - name: Run long-session demo
        run: python examples/run_demo.py

      - name: Build deterministic plugin package
        run: python tools/package_release.py --output-dir dist

      - name: Check release package for publication leaks
        run: python tools/check_publication_privacy.py --archive-dir dist

      - name: Upload matrix package
        uses: actions/upload-artifact@v7
        with:
          name: session-handoff-card-plugin-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  deterministic-package:
    name: Cross-platform deterministic package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download all matrix packages
        uses: actions/download-artifact@v8
        with:
          pattern: session-handoff-card-plugin-*
          path: artifacts

      - name: Require identical package hashes
        run: python tools/verify_release_set.py artifacts --expected-count 4

      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: session-handoff-card-plugin
          path: |
            artifacts/session-handoff-card-plugin-ubuntu-latest-py3.12/*.zip
            artifacts/session-handoff-card-plugin-ubuntu-latest-py3.12/SHA256SUMS.txt
            artifacts/session-handoff-card-plugin-ubuntu-latest-py3.12/release-manifest.json
          if-no-files-found: error
          retention-days: 7
